<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppointEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>AppointEase</h1>
        <p>Hospital Management: OPD, Diagnostics and Beds</p>
      </div>
      <div id="userbox" hidden>
        <span id="whoami"></span>
        <button id="logout-btn" type="button">Log out</button>
      </div>
    </div>
  </header>

  <div id="message" role="status"></div>

  <!-- ===== Login ===== -->
  <section id="login-screen">
    <div class="card login-card">
      <h2>Welcome to AppointEase</h2>
      <div class="role-tabs" id="login-roles">
        <button type="button" data-login="patient" class="active">Patient</button>
        <button type="button" data-login="doctor">Doctor</button>
        <button type="button" data-login="admin">Staff</button>
      </div>
      <form id="login-form">
        <input name="username" placeholder="Username" autocomplete="username" required>
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Log in</button>
      </form>
      <div id="register-box">
        <p class="hint">New patient? <a href="#" id="show-register">Create an account</a></p>
        <form id="register-form" hidden>
          <input name="name" placeholder="Full name" required>
          <input name="phone" placeholder="Phone number">
